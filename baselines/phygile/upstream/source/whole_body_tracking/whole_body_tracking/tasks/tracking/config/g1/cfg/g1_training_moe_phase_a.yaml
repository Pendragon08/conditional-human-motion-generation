# G1 MoE Phase A: Curriculum-Constrained Soft Top-K Routing
# 基于 g1_training_moe.yaml，将 hard top-k 替换为 motion-conditioned soft top-k。
# 用法：--g1_training_cfg <此文件路径>
#
# Phase A 训练流程：
#   1. Router 输入用 z_t（未来动作 embedding），不用 obs
#   2. 课程 mask 限制 router 只能选已解锁的 expert
#   3. 每 M 步更新候选集，步间用 softmax(logits/T) 平滑混合
#   4. CE loss 训练 router，不再用 hard routing

runner:
  num_steps_per_env: 24
  max_iterations: 200000
  save_interval: 1000
  experiment_name: "g1_flat_moe_phase_a"
  empirical_normalization: true
  upload_models_to_wandb: false

policy:
  class_name: "MoEActorCritic"
  init_noise_std: 1.0
  # actor_hidden_dims 在 MoE 模式下仅用于 critic head（expert 有自己的 dims）
  actor_hidden_dims: [2048, 1024, 512]
  critic_hidden_dims: [2048, 1024, 512]
  activation: "elu"
  encoder_hidden_dims: null          # 无独立 Encoder MLP，processed_obs 直接进 expert
  share_encoder: null
  future_command_encoder:
    per_frame_dim: 65              # 自动计算（= 2*num_actions + 7）
    immediate_steps: 2
    conv_steps: 5
    conv_channels: [256, 128]
    kernel_size: 3
    pooling: "avg"
    dropout: 0.0
    latent_dim: 128
    share_across_actor_critic: true
    apply_to_actor: true
    apply_to_critic: true

  # ========== MoE Soft Top-K 配置 (Phase A) ==========
  moe_config:
    num_experts: 12                  # 12 个 expert（10 levels + 2 spare）
    expert_hidden_dims: [512, 256]   # 每个 expert 的 MLP 隐藏层
    gate_hidden_dims: [256]          # Gating network 隐藏层
    top_k: 3                         # soft top-k 候选数
    routing_loss_coef: 0.1           # CE 路由监督 loss 系数
    load_balance_loss_coef: 0.01     # load-balance loss 系数（adaptive 模式）
    supervised_hard_ratio: 0.0       # 不再用 hard routing
    new_level_hard_ratio: 0.8        # 新 level 样本 80% 使用 hard routing（确保新 expert 学到对应特征）
    expert_warm_start: true          # 升级时复制上一 expert 参数（warm start 加速训练）

    # ---- Soft Top-K 路由参数 ----
    candidate_update_interval: 10    # 每 10 步更新候选集 (M=10 @50Hz)
    temperature: 0.5                 # softmax 温度 T<1 更集中
    logits_ema_alpha: 0.8            # logits EMA 平滑系数（仅 rollout）
    use_zt_for_gate: true            # router 用 z_t（未来动作 embedding）做输入

    # ---- Phase B 关闭 ----
    phase_b_enabled: false

commands:
  motion:
    preload_device: "cuda:1"
    future_steps: 2
    max_files_per_iter: 200
    encoder_future_steps: 5
    encoder_future_stride: 20
    enable_multi_file_bin_sampling: true
    random_static_prob: 0.1

    # ========== 等级内采样参数 ==========
    file_error_alpha: 0.25
    file_error_norm: 0.3
    file_uniform_mixture: 0.20
    sampling_temperature: 1.05
    file_success_beta: 0.4
    file_success_weight: 0.15
    file_success_warmup_iters: 6000

    # ========== Freeze 机制 ==========
    file_freeze_error_threshold: 0.1
    file_freeze_success_threshold: 0.15
    file_freeze_min_attempts: 55000
    file_freeze_iters: 5000
    file_drop_enabled: true
    file_drop_after_freezes: 2
    file_freeze_check_interval: 1000

    # ========== 课程学习配置 ==========
    curriculum_enabled: true
    curriculum_csv_path: "/ssd/bjc/bm_mlp/source/whole_body_tracking/whole_body_tracking/utils/filtered_texts_211.csv"
    curriculum_mocap_dir: "/ssd/humanoid/dataset/mocap_npz"
    curriculum_iteration_per_level: 1000
    curriculum_resume_level_override: 7
    # Per-level 自动升级超时（index 0 = lv1）：低 level 快速过渡，高 level 适当等待
    curriculum_auto_upgrade_per_level: [9000, 13000, 14000, 18000, 20000, 22000, 23000, 25000, 25000, 25000]
    # Eval-metric 收敛检测：mpjpe/mpjae 连续 N 次 eval 不再改善时提前升级
    curriculum_metric_convergence_enabled: true
    curriculum_metric_convergence_evals: 3         # 连续 3 次 eval 改善率 < 3% 才判收敛
    curriculum_metric_convergence_threshold: 0.03  # 相对改善率阈值（3%）
    curriculum_metric_convergence_min_iters: 3000  # 收敛升级的最低训练迭代数

    curriculum_new_level_weight: 10.0
    curriculum_max_difficulty: 10
    curriculum_min_level_sampling_ratio: 0.01
    # Difficulty-weighted 采样：高 level 文件少但难，给更高 per-file 采样密度
    curriculum_level_difficulty_weights: [1, 1, 1.2, 1.5, 2, 3, 4, 6, 8, 10]

    curriculum_use_subprocess_eval: false
    curriculum_mpjpe_threshold: 0.04
    curriculum_mpjae_threshold: 0.06

    curriculum_gradual_file_intro_enabled: true
    curriculum_gradual_file_intro_iters: 3000
    curriculum_gradual_file_intro_start_ratio: 0.2
    curriculum_gradual_file_intro_extra_start_level: 4
    curriculum_gradual_file_intro_extra_iters: 2000

    curriculum_lr_reset_enabled: true

    # ========== MoE 专用配置 ==========
    moe_supervised_until_level: 10   # 课程达到此 level 后切换为 adaptive 路由

algorithm:
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  entropy_coef: 0.005
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.001
  schedule: "adaptive"
  gamma: 0.99
  lam: 0.95
  desired_kl: 0.01
  max_grad_norm: 1.0
  normalize_advantage_per_mini_batch: false

rewards:
  motion_global_anchor_pos:
    weight: 0.8
    params:
      std: 0.2
